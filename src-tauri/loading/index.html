<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VALET</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #03060a; color: #8fd6ee;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        display: flex; align-items: center; justify-content: center;
      }
      /* Whole loading screen is a drag handle so the widget can be moved even
         before the orb UI loads. Content is inert so every mousedown hits body. */
      body { -webkit-user-select: none; }
      .wrap { text-align: center; pointer-events: none; }
      .brand { font-size: 28px; letter-spacing: 0.3em; color: #e6f8ff; }
      .sub { margin-top: 14px; font-size: 12px; color: #4f7e92; }
      .dot { animation: blink 1.2s infinite; }
      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
      /* Boot progress: a slim track that eases toward full so the user sees the
         app is opening. There's no granular boot signal, so it advances on a
         curve and snaps to 100% the moment the backend answers (then Rust
         navigates away to the real UI). */
      .track {
        margin: 22px auto 0;
        width: 168px; height: 3px;
        background: rgba(143, 214, 238, 0.14);
        border-radius: 3px; overflow: hidden;
      }
      .bar {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #6c4fe0, #8fd6ee);
        border-radius: 3px;
        transition: width 0.25s ease-out;
        box-shadow: 0 0 8px rgba(108, 79, 224, 0.6);
      }
    </style>
  </head>
  <body data-tauri-drag-region>
    <div class="wrap">
      <div class="brand">VALET</div>
      <div class="sub">starting<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
      <div class="track"><div class="bar" id="bar"></div></div>
    </div>
    <script>
      // Ease the bar toward ~94% while the backend boots; poll readiness so it
      // completes (and the screen feels responsive) the instant it's up. The
      // navigate to the real UI is driven by Rust; this is purely visual.
      (function () {
        var bar = document.getElementById('bar');
        var pct = 0, done = false;
        function paint() { bar.style.width = pct.toFixed(1) + '%'; }
        function tick() {
          if (done) return;
          // approach 94% asymptotically — fast at first, slowing as it nears
          pct += Math.max(0.4, (94 - pct) * 0.045);
          if (pct > 94) pct = 94;
          paint();
          setTimeout(tick, 120);
        }
        tick();
        // Poll the backend; on first success fill to 100% (Rust navigates shortly).
        function poll() {
          if (done) return;
          fetch('http://localhost:8340/', { mode: 'no-cors', cache: 'no-store' })
            .then(function () { done = true; pct = 100; paint(); })
            .catch(function () { setTimeout(poll, 400); });
        }
        poll();
      })();
    </script>
  </body>
</html>
