<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VALET</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #03060a; color: #8fd6ee;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        display: flex; align-items: center; justify-content: center;
      }
      .wrap { text-align: center; }
      .brand { font-size: 28px; letter-spacing: 0.3em; color: #e6f8ff; }
      .sub { margin-top: 14px; font-size: 12px; color: #4f7e92; }
      .dot { animation: blink 1.2s infinite; }
      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">VALET</div>
      <div class="sub">starting<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
    </div>
  </body>
</html>
