<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VALET menu</title>
<style>
  /* Custom tray popover — a fully self-styled replacement for the native macOS
     status-bar menu, which is a system-owned surface and cannot be forced white
     in Dark Mode. This webview is ours, so we pin it light unconditionally. */
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  body {
    /* margin leaves room for the card's drop shadow (window is transparent) */
    padding: 8px 10px 12px;
  }
  .card {
    background: #ffffff;
    border: 0.5px solid rgba(0, 0, 0, 0.12);
    border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22), 0 2px 6px rgba(0, 0, 0, 0.12);
    padding: 5px;
    overflow: hidden;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 30px;
    padding: 0 9px;
    border-radius: 6px;
    color: #1a1a1a;
    font-size: 13.5px;
    line-height: 1;
    white-space: nowrap;
  }
  .item:hover { background: #ededed; }
  .item:active { background: #e2e2e2; }
  .item .ico {
    width: 17px;
    height: 17px;
    flex: 0 0 17px;
    color: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .item .ico svg { width: 17px; height: 17px; display: block; }
  .item .label { flex: 1 1 auto; }
  .item .ext { color: #9a9a9a; font-size: 12px; flex: 0 0 auto; }
  .item.quit { color: #c8312b; }
  .item.quit .ico { color: #c8312b; }
  .sep {
    height: 1px;
    background: rgba(0, 0, 0, 0.08);
    margin: 5px 8px;
  }
</style>
</head>
<body>
  <div class="card" id="menu">
    <div class="item" data-action="open">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/></svg></span>
      <span class="label">Open VALET</span>
    </div>
    <div class="item" data-action="toggle_listen">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="10" x2="5" y2="14"/><line x1="9" y1="6" x2="9" y2="18"/><line x1="13" y1="9" x2="13" y2="15"/><line x1="17" y1="4" x2="17" y2="20"/><line x1="21" y1="10" x2="21" y2="14"/></svg></span>
      <span class="label">Toggle Listening</span>
    </div>
    <div class="item" data-action="settings">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></span>
      <span class="label">Settings…</span>
    </div>
    <div class="item" data-action="account">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
      <span class="label">Account</span>
      <span class="ext">&#8599;</span>
    </div>
    <div class="sep"></div>
    <div class="item" data-action="restart">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 4 21 9 16 9"/></svg></span>
      <span class="label">Restart server</span>
    </div>
    <div class="item" data-action="replay_setup">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36"/><polyline points="3 4 3 9 8 9"/></svg></span>
      <span class="label">Restart onboarding</span>
    </div>
    <div class="sep"></div>
    <div class="item quit" data-action="quit">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg></span>
      <span class="label">Quit VALET</span>
    </div>
  </div>

  <script>
    const T = () => (window.__TAURI__ || {});
    async function act(id) {
      try { await T().core.invoke('tray_action', { id }); } catch (e) {}
      try { await T().window.getCurrentWindow().hide(); } catch (e) {}
    }
    document.getElementById('menu').addEventListener('click', (e) => {
      const row = e.target.closest('.item');
      if (row && row.dataset.action) act(row.dataset.action);
    });
    // Dismiss when the popover loses focus (click elsewhere / Esc), matching
    // native menu behavior. Rust also hides on Focused(false) as a backstop.
    window.addEventListener('blur', () => {
      try { T().window.getCurrentWindow().hide(); } catch (e) {}
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { try { T().window.getCurrentWindow().hide(); } catch (e) {} }
    });
  </script>
</body>
</html>
