name: factory

# Supervised PR factory. Every PR runs two checks:
#   factory-tests  — the deterministic Python safety net (mock-based, no secrets/network)
#   factory-review — the supervised reviewer, turned into a fail-closed pass/fail check
#
# factory-review is GREEN whenever the reviewer actually RAN and produced a verdict
# (APPROVE-LOWRISK or ESCALATE) — so a human can merge an escalated PR normally, no admin
# override needed. It is RED only when no real review happened (fail-closed) — e.g. a PR that
# modifies .github/** which the Claude action skips by design, or an unrecognized verdict.
#
# The verdict still governs AUTO-merge: only APPROVE-LOWRISK is auto-merge-eligible (gated
# behind the repo variable FACTORY_AUTOMERGE, unset = off). ESCALATE is reviewed + labeled,
# then left for a human to merge deliberately. Auto-merge is enabled only after a soak.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  factory-tests:
    name: factory-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run deterministic test gate
        # Only the mock-based, hermetic tests run here: no live LLM calls, no network,
        # no API key. test_classifier.py (live Anthropic) and test_browser_integration.py
        # (network + Playwright) are intentionally excluded from the merge gate.
        run: |
          python -m pytest tests/test_e2e_pipeline.py tests/test_feedback_loop.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type-check + build
        # tsc (strict) + vite build. Catches type errors and broken imports across
        # the whole frontend before a PR can merge. Deterministic, no secrets.
        run: |
          cd frontend
          npm ci
          npm run build

  factory-review:
    name: factory-review
    needs: factory-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Supervised review
        id: review
        # Pinned to a commit SHA rather than the floating @v1 tag so the action
        # code AND the claude-agent-sdk it bundles are frozen — runs stay
        # reproducible instead of silently changing behavior when @v1 moves.
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: '--allowed-tools "Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(git diff:*),Bash(git fetch:*),Bash(git log:*)"'
          prompt: |
            You are the reviewer for a supervised PR factory. Review pull request
            #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            The factory-tests job has already passed — this job depends on it.

            Use the **pr-reviewer** subagent defined at .claude/agents/pr-reviewer.md and
            follow its instructions exactly:
              1. Read the `## Merge policy` block in CLAUDE.md to learn this repo's low-risk
                 surfaces and its always-escalate surfaces.
              2. Read the PR diff against the base branch.
              3. Walk the escalation gates and decide APPROVE-LOWRISK or ESCALATE. When in
                 doubt, ESCALATE — this is a paying client's product.

            Then take exactly these actions, IN THIS ORDER:
              1. FIRST, write your decision as a single bare token to a file named
                 `.factory-verdict` in the repository root — either `APPROVE-LOWRISK` or
                 `ESCALATE` and nothing else. This file is how the gate is computed, so write
                 it before anything else.
              2. Post your review as a PR comment, ending with the exact VERDICT line
                 (`VERDICT: APPROVE-LOWRISK` or `VERDICT: ESCALATE — <reason>`).
              3. If APPROVE-LOWRISK: add the label `factory:lowrisk` to the PR.
                 If ESCALATE: add the label `factory:escalate` to the PR.

            Do NOT merge the PR under any circumstances.

      - name: Compute merge gate (fail-closed)
        env:
          # Path to the reviewer's full execution log (SDK messages), exposed by
          # claude-code-action. Used as a fallback verdict source below.
          EXEC_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          # GREEN if the reviewer actually RAN and reached a recognized verdict
          # (low-risk OR escalate), so escalated PRs stay human-mergeable without
          # an admin override. RED (fail-closed) only when no real review happened.
          #
          # Verdict sources, in order:
          #   1. `.factory-verdict` file — what the reviewer is asked to write.
          #   2. The `VERDICT:` line in the reviewer's final message (parsed from
          #      the execution log). This catches a review that reached a decision
          #      but skipped the file write — a failure mode we hit when the agent
          #      finished in prose without performing its side-effect tool calls.
          #   3. Review ran (produced final output) but no parseable verdict ->
          #      treat as ESCALATE so a human decides; never auto-merges.
          # If the reviewer produced no output at all (e.g. it skipped a PR that
          # touches .github/**), there is nothing to parse -> fail closed.
          verdict=""

          if [ -f .factory-verdict ]; then
            verdict="$(tr -d '[:space:]' < .factory-verdict)"
            echo "Verdict source: .factory-verdict file"
          fi

          # Parse the reviewer's final message text only (NOT the whole log — the
          # input prompt echoes both tokens and would false-match). `-s` slurps
          # JSONL into an array; `flatten` also collapses the single-array case, so
          # this handles both log shapes. jq is preinstalled on GitHub runners.
          final=""
          if [ -z "$verdict" ] && [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
            final="$(jq -rs 'flatten | map(select(type=="object" and .type=="result" and (.result|type)=="string") | .result) | last // ""' "$EXEC_FILE" 2>/dev/null || true)"
            case "$final" in
              *"VERDICT: APPROVE-LOWRISK"*) verdict="APPROVE-LOWRISK"; echo "Verdict source: VERDICT line in reviewer output" ;;
              *"VERDICT: ESCALATE"*)        verdict="ESCALATE";        echo "Verdict source: VERDICT line in reviewer output" ;;
            esac
            if [ -z "$verdict" ] && [ -n "$final" ]; then
              verdict="ESCALATE"
              echo "::warning::Reviewer ran but emitted no VERDICT line; treating as ESCALATE (human must merge)."
            fi
          fi

          if [ -z "$verdict" ]; then
            echo "::error::No verdict from the reviewer — no .factory-verdict file and no reviewer output to parse (e.g. a PR touching .github/** which the action skips). Failing closed; a human admin must review and override."
            exit 1
          fi

          echo "Reviewer verdict: '${verdict}'"
          case "$verdict" in
            APPROVE-LOWRISK)
              echo "APPROVE-LOWRISK — low-risk; eligible for auto-merge." ;;
            ESCALATE)
              echo "ESCALATE — reviewed and flagged for a human. Mergeable by a person; will not auto-merge." ;;
            *)
              echo "::error::Unrecognized verdict '${verdict}' — failing closed."
              exit 1 ;;
          esac
          exit 0
