<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VALET</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#06061a" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Frameless-window drag layer: covers the whole window so the menu-bar orb
         widget can be grabbed anywhere to move it. Tauri moves the window natively
         on mousedown over a [data-tauri-drag-region] element; interactive elements
         (#controls, reply, panels) sit above it and stay clickable. -->
    <div id="drag-bar" data-tauri-drag-region></div>

    <!-- Frameless-window resize grips: thin edge/corner strips that sit above the
         drag layer and ask Tauri for a native resize drag (macOS gives a
         decorations:false window no resize border of its own). Wired in main.ts;
         gated by the orb-drag capability (start-resize-dragging). -->
    <div id="resize-handles" aria-hidden="true">
      <div class="rz rz-n" data-dir="North"></div>
      <div class="rz rz-s" data-dir="South"></div>
      <div class="rz rz-e" data-dir="East"></div>
      <div class="rz rz-w" data-dir="West"></div>
      <div class="rz rz-nw" data-dir="NorthWest"></div>
      <div class="rz rz-ne" data-dir="NorthEast"></div>
      <div class="rz rz-sw" data-dir="SouthWest"></div>
      <div class="rz rz-se" data-dir="SouthEast"></div>
    </div>

    <!-- Native-style window controls (top-left), available across the whole app
         (not just onboarding): close hides the popover, minimize hides to the
         menu bar. They sit above the drag layer so clicks land on them. -->
    <div id="window-lights">
      <button id="win-close" class="win-light close" type="button" aria-label="Hide window" title="Hide"></button>
      <button id="win-min" class="win-light min" type="button" aria-label="Minimize" title="Minimize"></button>
    </div>

    <canvas id="orb-canvas"></canvas>

    <!-- Minimal controls — top right -->
    <div id="controls">
      <button id="btn-wake-toggle" class="wake-toggle on" title="Always listening — VALET hears you without holding ⌃⌥ (push-to-talk always works either way)">
        <span class="wake-label">Always listening</span>
        <span class="wake-switch" aria-hidden="true"><span class="wake-knob"></span></span>
      </button>
      <button id="btn-menu" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
    </div>

    <div id="valet-reply"></div>
    <!-- Voice-state indicator (#257): the single, always-visible source of truth
         for what VALET is doing with the mic — a colored dot + plain-language
         label. Replaces the old blank-half-the-time #status-text and the separate
         #ptt-hint. aria-live so it's announced to screen readers on change. -->
    <div id="voice-state" data-mode="ptt" aria-live="polite">
      <span class="vs-dot" aria-hidden="true"></span>
      <span class="vs-label"></span>
    </div>
    <div id="valet-label">VALET</div>
    <div id="error-text"></div>
    <div id="diag-panel" class="diag-panel">
      <canvas id="diag-mic-canvas" width="140" height="32"></canvas>
      <div id="diag-transcript"></div>
    </div>

    <!-- Process panel — mounted lazily by processPanel.ts. -->
    <div id="process-panel-root"></div>

    <!-- Design panel — mounted lazily by designPanel.ts. -->
    <div id="design-panel-root"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
